name: Correctness and Portability

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  native:
    name: Integrated engine (${{ matrix.runner }}, ${{ matrix.compiler }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            compiler: gcc
            arch: x86-64-popcnt
          - runner: ubuntu-22.04
            compiler: clang
            arch: x86-64-popcnt
          - runner: macos-14
            compiler: clang
            arch: apple-silicon
          - runner: macos-15-intel
            compiler: clang
            arch: x86-64-popcnt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned move-generation oracle
        run: python -m pip install chess==1.11.2
      - name: Validate metadata, packaging and public paths
        run: |
          python scripts/check_release.py
          python scripts/release_pipeline_test.py
          python scripts/public_paths_test.py
          python scripts/check_public_paths.py
      - name: Build embedded release candidate
        run: make build ARCH=${{ matrix.arch }} COMP=${{ matrix.compiler }}
      - name: Validate identity, options, protocol, limits and SMP
        run: |
          python scripts/verify_build_identity.py ./coco-chess --arch ${{ matrix.arch }}
          python scripts/validate_options.py ./coco-chess --chess960
          python scripts/uci_conformance.py ./coco-chess
          python scripts/verify_uci_limits.py ./coco-chess
          python scripts/verify_smp_lifecycle.py ./coco-chess
          python scripts/verify_fixed_signature.py ./coco-chess
      - name: Validate embedded bytes, standalone startup and all FRC layouts
        run: >-
          python scripts/verify_20_release.py ./coco-chess --frc
          --report scratch/ci-release-verification.json
      - name: Validate datagen provenance and safe resume
        if: matrix.runner == 'ubuntu-22.04' && matrix.compiler == 'gcc'
        run: python scripts/datagen_manifest_test.py --engine ./coco-chess
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-${{ matrix.runner }}-${{ matrix.compiler }}
          path: scratch/ci-release-verification.json
          if-no-files-found: ignore

  windows-cross-build:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64
      - run: make build ARCH=x86-64-avx2 COMP=mingw
      - run: test -s coco-chess.exe

  windows-native:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc
      - run: python -m pip install chess==1.11.2
      - name: Build and verify integrated Windows candidate
        shell: pwsh
        run: |
          $env:PATH = "C:\msys64\ucrt64\bin;$env:PATH"
          python scripts/build_release.py --arch x86-64-avx2 --output coco-chess.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/validate_options.py ./coco-chess.exe --chess960
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/uci_conformance.py ./coco-chess.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/verify_smp_lifecycle.py ./coco-chess.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/verify_20_release.py ./coco-chess.exe --frc --report scratch/ci-release-verification.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
