name: Build Release Draft

on:
  push:
    branches:
      - 'codex/release-1.5-ci'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  correctness:
    uses: ./.github/workflows/ci.yml

  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ================================================================
          # Windows binaries are cross-compiled with MinGW; native Windows
          # execution is covered separately by correctness CI.
          # ================================================================
          - name: windows-x86-64-popcnt
            runner: ubuntu-22.04
            arch: x86-64-popcnt
            comp: mingw
            validate: false
            artifact: coco-chess-windows-x86-64-popcnt.exe

          - name: windows-x86-64-avx2
            runner: ubuntu-22.04
            arch: x86-64-avx2
            comp: mingw
            validate: false
            artifact: coco-chess-windows-x86-64-avx2.exe

          - name: windows-x86-64-bmi2
            runner: ubuntu-22.04
            arch: x86-64-bmi2
            comp: mingw
            validate: false
            artifact: coco-chess-windows-x86-64-bmi2.exe

          - name: windows-x86-64-avx512
            runner: ubuntu-22.04
            arch: x86-64-avx512
            comp: mingw
            validate: false
            artifact: coco-chess-windows-x86-64-avx512.exe

          # ================================================================
          # Linux — native GCC builds
          # ================================================================
          - name: linux-x86-64-popcnt
            runner: ubuntu-22.04
            arch: x86-64-popcnt
            comp: gcc
            validate: true
            artifact: coco-chess-linux-x86-64-popcnt

          - name: linux-x86-64-avx2
            runner: ubuntu-22.04
            arch: x86-64-avx2
            comp: gcc
            validate: true
            artifact: coco-chess-linux-x86-64-avx2

          - name: linux-x86-64-bmi2
            runner: ubuntu-22.04
            arch: x86-64-bmi2
            comp: gcc
            validate: true
            artifact: coco-chess-linux-x86-64-bmi2

          - name: linux-x86-64-avx512
            runner: ubuntu-22.04
            arch: x86-64-avx512
            comp: gcc
            validate: false
            artifact: coco-chess-linux-x86-64-avx512

          # ================================================================
          # Linux ARM64 — baseline ARMv8 for Pi 5 and ARM servers
          # ================================================================
          - name: linux-arm64
            runner: ubuntu-24.04-arm
            arch: armv8
            comp: gcc
            validate: true
            artifact: coco-chess-linux-arm64

          - name: linux-arm64-dotprod
            runner: ubuntu-24.04-arm
            arch: armv8-dotprod
            comp: gcc
            validate: true
            artifact: coco-chess-linux-arm64-dotprod

          # ================================================================
          # macOS Apple Silicon (M1/M2/M3/M4) — native ARM64 runner
          # ================================================================
          - name: macos-apple-silicon
            runner: macos-15
            arch: apple-silicon
            comp: clang
            validate: true
            artifact: coco-chess-macos-apple-silicon

          # ================================================================
          # macOS Intel — x86-64 runner
          # ================================================================
          - name: macos-x86-64-popcnt
            runner: macos-15-intel
            arch: x86-64-popcnt
            comp: clang
            validate: true
            artifact: coco-chess-macos-x86-64-popcnt

          - name: macos-x86-64-avx2
            runner: macos-15-intel
            arch: x86-64-avx2
            comp: clang
            validate: true
            artifact: coco-chess-macos-x86-64-avx2

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate release metadata
        run: python3 scripts/check_release.py

      # --- Toolchain setup ---
      - name: Install MinGW (Windows cross-compile)
        if: matrix.comp == 'mingw'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64

      - name: Install GCC (Linux)
        if: matrix.comp == 'gcc'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      # macOS runners come with Clang via Xcode — no setup needed

      # --- Generate embedded NNUE header ---
      - name: Generate Embedded NNUE Header
        run: python3 scripts/make_nnue_header.py

      # --- Build ---
      - name: Build Engine
        run: |
          make build ARCH=${{ matrix.arch }} COMP=${{ matrix.comp }}

      - name: Verify Network Identity
        run: |
          python3 testing/verify_nnue_file.py coco.nnue --l1-size 512 --sha256 392BE46C8E06C6D0CB6BEDF00D8E3D08950D11DAA883362DE98F0C1DEEE68055

      - name: Validate Native Release Binary
        if: matrix.validate
        run: |
          python3 testing/verify_build_identity.py ./coco-chess --arch ${{ matrix.arch }}
          python3 testing/validate_options.py ./coco-chess
          python3 testing/verify_uci_limits.py ./coco-chess
          python3 testing/verify_fixed_signature.py ./coco-chess

      # --- Rename to final artifact name ---
      - name: Rename Binary
        run: |
          if [ -f "coco-chess.exe" ]; then
            mv coco-chess.exe ${{ matrix.artifact }}
          else
            mv coco-chess ${{ matrix.artifact }}
          fi

      - name: Record Artifact Provenance
        run: |
          runtime_flag=""
          if [ "${{ matrix.validate }}" = "true" ]; then runtime_flag="--runtime-engine"; fi
          python3 scripts/release_manifest.py artifact \
            --artifact "${{ matrix.artifact }}" \
            --arch "${{ matrix.arch }}" \
            --compiler "${{ matrix.comp }}" \
            --source-commit "${{ github.sha }}" \
            --network coco.nnue \
            --fixed-signature-verified "${{ matrix.validate }}" \
            $runtime_flag \
            --output "${{ matrix.artifact }}.metadata.json"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}
            ${{ matrix.artifact }}.metadata.json

  draft:
    name: Create reviewed release draft
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, correctness]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require completed release review and matching tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/check_release.py --ready --tag "$RELEASE_TAG"
      - uses: actions/download-artifact@v4
        with:
          path: ./dist/
          merge-multiple: true
      - name: Include licenses
        run: |
          cp LICENSE ./dist/LICENSE.txt
          cp Fathom/src/LICENSE ./dist/FATHOM-LICENSE.txt
      - name: Verify artifact completeness and provenance
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          python3 scripts/release_manifest.py assemble --dist ./dist --tag "$RELEASE_TAG" --source-commit "$RELEASE_COMMIT" --output ./dist/release-manifest.json
          python3 -c "import pathlib; [p.unlink() for p in pathlib.Path('dist').glob('*.metadata.json')]"
      - name: Generate checksums and use reviewed notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          (cd dist && sha256sum coco-chess-* LICENSE.txt FATHOM-LICENSE.txt release-manifest.json > SHA256SUMS.txt)
          python3 scripts/render_release_notes.py --repository "$RELEASE_REPOSITORY" --tag "$RELEASE_TAG" --output release_notes.md
      - name: Create draft only
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
          files: |
            ./dist/coco-chess-*
            ./dist/LICENSE.txt
            ./dist/FATHOM-LICENSE.txt
            ./dist/release-manifest.json
            ./dist/SHA256SUMS.txt
          body_path: release_notes.md
